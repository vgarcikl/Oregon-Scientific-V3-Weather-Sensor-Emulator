<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="540" height="260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cristal de 32,768 kHz entre XTAL1 y XTAL2</title>
  <desc id="d">Cristal en serie entre los pines XTAL1 y XTAL2, con un condensador de carga a GND en cada pin.</desc>
  <style>
    .w { stroke: #24292f; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .n { fill: #24292f; }
    .t { fill: #24292f; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; }
    .b { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .w { stroke: #e6edf3; }
      .n { fill: #e6edf3; }
      .t { fill: #e6edf3; }
    }
  </style>

  <!-- Etiquetas de pines -->
  <text class="t b" x="15" y="85">XTAL1</text>
  <text class="t b" x="440" y="85">XTAL2</text>

  <!-- Línea principal -->
  <path class="w" d="M80 80 H225"/>
  <path class="w" d="M305 80 H435"/>

  <!-- Cristal -->
  <path class="w" d="M225 62 V98"/>
  <rect class="w" x="240" y="64" width="50" height="32"/>
  <path class="w" d="M305 62 V98"/>
  <text class="t" x="265" y="44" text-anchor="middle">Cristal 32,768 kHz</text>

  <!-- Nodos -->
  <circle class="n" cx="150" cy="80" r="4"/>
  <circle class="n" cx="380" cy="80" r="4"/>

  <!-- Condensador C1 -->
  <path class="w" d="M150 80 V145"/>
  <path class="w" d="M132 145 H168"/>
  <path class="w" d="M132 158 H168"/>
  <path class="w" d="M150 158 V205"/>
  <text class="t" x="178" y="157">C1</text>

  <!-- Condensador C2 -->
  <path class="w" d="M380 80 V145"/>
  <path class="w" d="M362 145 H398"/>
  <path class="w" d="M362 158 H398"/>
  <path class="w" d="M380 158 V205"/>
  <text class="t" x="408" y="157">C2</text>

  <!-- Tierras -->
  <path class="w" d="M130 205 H170 M137 213 H163 M145 221 H155"/>
  <path class="w" d="M360 205 H400 M367 213 H393 M375 221 H385"/>
  <text class="t" x="150" y="245" text-anchor="middle">GND</text>
  <text class="t" x="380" y="245" text-anchor="middle">GND</text>
</svg>
